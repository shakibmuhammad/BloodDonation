about.eyebrow=About BloodLink
about.heading=Care travels best between neighbours.
about.intro=BloodLink is a simple directory and request board designed to help people in Bangladesh find one another in moments that matter.
about.sectionHeading=Make the next step easier
about.body1=When a family needs blood, time and clear information matter. BloodLink brings donor availability, local requests, and contact details into one place so people can coordinate directly.
about.body2=Donors decide when they can help. Profiles must be approved, and availability can be turned on or off at any time.
about.value1.title=People first
about.value1.body=Keep the information clear, useful, and centred on families and donors.
about.value2.title=Local connection
about.value2.body=Search by district and upazila / thana to start close to where help is needed.
about.value3.title=Respect choice
about.value3.body=A listing helps people connect; every donation remains a personal choice.
about.note=BloodLink is a community connection tool. Donors should follow medical screening guidance from qualified health professionals and the hospital blood bank.
