home.faq.eyebrow=Answers to common questions
home.faq.title=Frequently asked questions
home.faq.q1=Is donating blood safe?
home.faq.a1=Blood donation is generally safe when a blood service screens you and trained staff use sterile, single-use equipment. Tell staff if you feel unwell.
home.faq.q2=How often can I donate?
home.faq.a2=BloodLink asks donors to wait at least three months between recorded whole blood donations. Local rules may require a longer interval; follow the screening staff’s advice.
home.faq.q3=What should I eat before donating?
home.faq.a3=Have a healthy meal and drink water before your appointment. Do not skip meals, and follow your local blood service’s guidance.
home.faq.q4=How long does a donation take?
home.faq.a4=Plan for about an hour at the donation center. The blood draw often takes around 8–10 minutes; screening and recovery take extra time.
home.faq.q5=Who should not donate?
home.faq.a5=Do not donate when you feel unwell. Anemia, pregnancy, some conditions or medicines, travel, and other factors may affect eligibility. Share accurate information with screening staff.
home.faq.q6=Is my phone number private?
home.faq.a6=Your number is not shown to public visitors. It is visible in search results to signed-in active donors who may contact you about a donation.
