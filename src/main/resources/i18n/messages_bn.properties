home.faq.q1=রক্তদান কি নিরাপদ?
home.faq.a1=রক্তসেবা কেন্দ্রের স্বাস্থ্য যাচাই এবং প্রশিক্ষিত কর্মীর জীবাণুমুক্ত একবার-ব্যবহারযোগ্য সরঞ্জামে রক্তদান সাধারণত নিরাপদ। অসুস্থ বোধ করলে কর্মীদের জানান।
home.faq.q2=কতদিন পরপর রক্ত দিতে পারি?
home.faq.a2=BloodLink-এ নথিভুক্ত পুরো রক্তদানের মাঝে অন্তত তিন মাস বিরতি রাখুন। স্থানীয় নিয়মে আরও বেশি বিরতি লাগতে পারে; স্ক্রিনিং কর্মীর পরামর্শ মানুন।
home.faq.q3=রক্তদানের আগে কী খাব?
home.faq.a3=অ্যাপয়েন্টমেন্টের আগে স্বাস্থ্যকর খাবার খান ও পানি পান করুন। খাবার এড়িয়ে যাবেন না এবং স্থানীয় রক্তসেবা কেন্দ্রের নির্দেশনা মানুন।
home.faq.q4=রক্তদান করতে কতক্ষণ লাগে?
home.faq.a4=রক্তসেবা কেন্দ্রে প্রায় এক ঘণ্টা সময় রাখুন। রক্ত সংগ্রহে সাধারণত ৮–১০ মিনিট লাগে; স্বাস্থ্য যাচাই ও বিশ্রামে বাড়তি সময় লাগে।
home.faq.q5=কারা রক্ত দিতে পারবেন না?
home.faq.a5=অসুস্থ বোধ করলে রক্ত দেবেন না। রক্তস্বল্পতা, গর্ভাবস্থা, কিছু রোগ বা ওষুধ, ভ্রমণ এবং অন্যান্য বিষয় যোগ্যতায় প্রভাব ফেলতে পারে। স্ক্রিনিং কর্মীকে সঠিক তথ্য দিন।
home.faq.q6=আমার ফোন নম্বর কি ব্যক্তিগত?
home.faq.a6=সাধারণ দর্শকরা আপনার নম্বর দেখতে পান না। সাইন ইন করা সক্রিয় রক্তদাতারা যোগাযোগের জন্য সার্চ ফলাফলে নম্বরটি দেখতে পান।
